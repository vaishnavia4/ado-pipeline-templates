# Restore (with NuGet cache), build, test with coverage.
parameters:
  # Solution or project glob.
  - name: solution
    type: string
    default: '**/*.sln'
  # Build configuration.
  - name: buildConfiguration
    type: string
    default: Release
  # Run unit tests and publish results and coverage.
  - name: runTests
    type: boolean
    default: true

steps:
  - bash: echo "##vso[task.setvariable variable=NUGET_PACKAGES]$(Pipeline.Workspace)/.nuget/packages"
    displayName: Set NuGet cache folder
  # The cache key uses packages.lock.json (set RestorePackagesWithLockFile=true in your projects).
  - task: Cache@2
    displayName: Cache NuGet packages
    inputs:
      key: 'nuget | "$(Agent.OS)" | **/packages.lock.json,!**/bin/**,!**/obj/**'
      restoreKeys: |
        nuget | "$(Agent.OS)"
      path: $(NUGET_PACKAGES)
  - task: DotNetCoreCLI@2
    displayName: dotnet restore
    inputs:
      command: restore
      projects: ${{ parameters.solution }}
  - task: DotNetCoreCLI@2
    displayName: dotnet build
    inputs:
      command: build
      projects: ${{ parameters.solution }}
      arguments: --configuration ${{ parameters.buildConfiguration }} --no-restore -p:Version=$(appVersion)
  - ${{ if eq(parameters.runTests, true) }}:
      - task: DotNetCoreCLI@2
        displayName: dotnet test (coverage)
        inputs:
          command: test
          projects: ${{ parameters.solution }}
          arguments: >-
            --configuration ${{ parameters.buildConfiguration }} --no-build
            --collect:"XPlat Code Coverage"
          publishTestResults: true
      - task: PublishCodeCoverageResults@2
        displayName: Publish code coverage
        inputs:
          summaryFileLocation: $(Agent.TempDirectory)/**/coverage.cobertura.xml
