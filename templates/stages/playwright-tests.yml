# Stage: run Playwright tests, publish JUnit results and the HTML report.
parameters:
  # Stage identifier (letters, digits, underscore).
  - name: stageName
    type: string
    default: playwright
  # Stages this stage depends on.
  - name: dependsOn
    type: object
    default: []
  # Stage condition.
  - name: condition
    type: string
    default: succeeded()
  # Agent pool definition.
  - name: pool
    type: object
    default:
      vmImage: ubuntu-24.04
  # Node.js version spec.
  - name: nodeVersion
    type: string
    default: 20.x
  # Folder containing the Playwright project (package.json).
  - name: workingDirectory
    type: string
    default: .
  # Base URL of the environment under test, exposed to tests as BASE_URL.
  - name: baseUrl
    type: string
  # Playwright project filter (for example chromium). Leave empty for all projects.
  - name: project
    type: string
    default: ''
  # Extra arguments for npx playwright test (for example --grep @smoke).
  - name: extraArgs
    type: string
    default: ''
  # Browsers to install.
  - name: browsers
    type: string
    default: chromium
  # Optional variable group (link it to Key Vault for test credentials). Leave empty for none.
  - name: variableGroup
    type: string
    default: ''
  # Artifact name for the HTML report (unique per pipeline run).
  - name: reportArtifactName
    type: string
    default: playwright-report
  # Job timeout in minutes.
  - name: timeoutInMinutes
    type: number
    default: 60

stages:
  - stage: ${{ parameters.stageName }}
    displayName: Playwright tests
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    variables:
      - ${{ if ne(parameters.variableGroup, '') }}:
          - group: ${{ parameters.variableGroup }}
    jobs:
      - job: playwright
        displayName: Playwright
        timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
        pool: ${{ parameters.pool }}
        steps:
          - template: ../steps/checkout-secure.yml
          - template: ../steps/node-setup-cache.yml
            parameters:
              nodeVersion: ${{ parameters.nodeVersion }}
              workingDirectory: ${{ parameters.workingDirectory }}
          - script: npx playwright install --with-deps ${{ parameters.browsers }}
            displayName: Install browsers
            workingDirectory: ${{ parameters.workingDirectory }}
          - bash: |
              set -euo pipefail
              args=(--reporter=list,junit,html)
              if [ -n "${PROJECT}" ]; then args+=(--project "${PROJECT}"); fi
              npx playwright test "${args[@]}" ${{ parameters.extraArgs }}
            displayName: Run tests
            workingDirectory: ${{ parameters.workingDirectory }}
            env:
              CI: 'true'
              BASE_URL: ${{ parameters.baseUrl }}
              PROJECT: ${{ parameters.project }}
              PLAYWRIGHT_JUNIT_OUTPUT_FILE: $(Build.ArtifactStagingDirectory)/results/junit.xml
              PLAYWRIGHT_HTML_OPEN: never
          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/results/junit.xml
              testRunTitle: Playwright (${{ parameters.baseUrl }})
              failTaskOnFailedTests: true
          - template: ../steps/publish-artifact.yml
            parameters:
              path: ${{ parameters.workingDirectory }}/playwright-report
              artifactName: ${{ parameters.reportArtifactName }}
              condition: succeededOrFailed()
