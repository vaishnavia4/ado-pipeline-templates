# Stage: install, lint, test and package a Python application.
parameters:
  # Stage identifier (letters, digits, underscore).
  - name: stageName
    type: string
    default: build
  # Stages this stage depends on.
  - name: dependsOn
    type: object
    default: []
  # Stage condition.
  - name: condition
    type: string
    default: succeeded()
  # Agent pool definition.
  - name: pool
    type: object
    default:
      vmImage: ubuntu-24.04
  # Python version spec.
  - name: pythonVersion
    type: string
    default: '3.12'
  # Folder containing the application.
  - name: workingDirectory
    type: string
    default: .
  # Requirements file (relative to workingDirectory). Must include pytest and pytest-cov.
  - name: requirementsFile
    type: string
    default: requirements.txt
  # Lint command. Leave empty to skip (for example: ruff check .).
  - name: lintCommand
    type: string
    default: ''
  # Extra arguments passed to pytest.
  - name: pytestArgs
    type: string
    default: ''
  # Versioning strategy: buildNumber or gitversion.
  - name: versionStrategy
    type: string
    default: buildNumber
  # Major.minor prefix for the buildNumber strategy.
  - name: majorMinor
    type: string
    default: '1.0'
  # Pipeline artifact name.
  - name: artifactName
    type: string
    default: drop

stages:
  - stage: ${{ parameters.stageName }}
    displayName: Build (Python)
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - template: ../jobs/python-build-test.yml
        parameters:
          pool: ${{ parameters.pool }}
          pythonVersion: ${{ parameters.pythonVersion }}
          workingDirectory: ${{ parameters.workingDirectory }}
          requirementsFile: ${{ parameters.requirementsFile }}
          lintCommand: ${{ parameters.lintCommand }}
          pytestArgs: ${{ parameters.pytestArgs }}
          versionStrategy: ${{ parameters.versionStrategy }}
          majorMinor: ${{ parameters.majorMinor }}
          artifactName: ${{ parameters.artifactName }}
