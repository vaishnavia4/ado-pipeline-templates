# Stage: secret scanning (gitleaks), dependency and code scanning (Snyk), static analysis (SonarCloud or SonarQube).
# Every scanner fails the stage on findings at or above the configured severity.
parameters:
  # Stage identifier (letters, digits, underscore).
  - name: stageName
    type: string
    default: security_scans
  # Stages this stage depends on.
  - name: dependsOn
    type: object
    default: []
  # Stage condition.
  - name: condition
    type: string
    default: succeeded()
  # Agent pool definition.
  - name: pool
    type: object
    default:
      vmImage: ubuntu-24.04
  # Run gitleaks secret scanning over the full git history.
  - name: enableGitleaks
    type: boolean
    default: true
  # gitleaks release to download. The download is verified against the published checksums file.
  - name: gitleaksVersion
    type: string
    default: 8.21.2
  # Run Snyk. Requires the Snyk Security Scan extension and a Snyk service connection.
  - name: enableSnyk
    type: boolean
    default: false
  # Snyk service connection name.
  - name: snykServiceConnection
    type: string
    default: ''
  # Snyk organization id.
  - name: snykOrganization
    type: string
    default: ''
  # Snyk test type: app (open source dependencies), code or iac.
  - name: snykTestType
    type: string
    default: app
  # Lowest severity that fails the build: low, medium, high or critical.
  - name: snykSeverityThreshold
    type: string
    default: high
  # Static analysis provider: none, sonarcloud or sonarqube.
  - name: sonarProvider
    type: string
    default: none
    values:
      - none
      - sonarcloud
      - sonarqube
  # Sonar service connection name.
  - name: sonarServiceConnection
    type: string
    default: ''
  # SonarCloud organization key (sonarcloud only).
  - name: sonarOrganization
    type: string
    default: ''
  # Sonar project key.
  - name: sonarProjectKey
    type: string
    default: ''
  # Extra scanner properties, one per line.
  - name: sonarExtraProperties
    type: string
    default: sonar.sources=.

stages:
  - stage: ${{ parameters.stageName }}
    displayName: Security scans
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - ${{ if eq(parameters.enableGitleaks, true) }}:
          - job: gitleaks
            displayName: Secret scan (gitleaks)
            pool: ${{ parameters.pool }}
            steps:
              - template: ../steps/checkout-secure.yml
                parameters:
                  fetchDepth: 0
              - bash: |
                  set -euo pipefail
                  base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
                  archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  work="$(mktemp -d)"
                  curl --fail --silent --show-error --location --output "${work}/${archive}" "${base}/${archive}"
                  curl --fail --silent --show-error --location --output "${work}/${checksums}" "${base}/${checksums}"
                  (cd "${work}" && sha256sum --ignore-missing --check "${checksums}")
                  tar --extract --gzip --file "${work}/${archive}" --directory "${work}" gitleaks
                  "${work}/gitleaks" git --redact --exit-code 1 \
                    --report-format sarif --report-path "${BUILD_ARTIFACTSTAGINGDIRECTORY}/gitleaks.sarif" .
                displayName: Run gitleaks
                env:
                  GITLEAKS_VERSION: ${{ parameters.gitleaksVersion }}
              - template: ../steps/publish-artifact.yml
                parameters:
                  path: $(Build.ArtifactStagingDirectory)/gitleaks.sarif
                  artifactName: gitleaks_${{ parameters.stageName }}
                  condition: failed()
      - ${{ if eq(parameters.enableSnyk, true) }}:
          - job: snyk
            displayName: Dependency scan (Snyk)
            pool: ${{ parameters.pool }}
            steps:
              - template: ../steps/checkout-secure.yml
              # TODO: confirm the SnykSecurityScan major version your installed extension provides.
              - task: SnykSecurityScan@1
                displayName: Snyk ${{ parameters.snykTestType }}
                inputs:
                  serviceConnectionEndpoint: ${{ parameters.snykServiceConnection }}
                  testType: ${{ parameters.snykTestType }}
                  organization: ${{ parameters.snykOrganization }}
                  severityThreshold: ${{ parameters.snykSeverityThreshold }}
                  failOnIssues: true
                  monitorWhen: always
      - ${{ if eq(parameters.sonarProvider, 'sonarcloud') }}:
          - job: sonarcloud
            displayName: Static analysis (SonarCloud)
            pool: ${{ parameters.pool }}
            steps:
              - template: ../steps/checkout-secure.yml
                parameters:
                  fetchDepth: 0
              # TODO: confirm the SonarCloud task major versions your installed extension provides.
              - task: SonarCloudPrepare@3
                displayName: Prepare analysis
                inputs:
                  SonarCloud: ${{ parameters.sonarServiceConnection }}
                  organization: ${{ parameters.sonarOrganization }}
                  scannerMode: cli
                  configMode: manual
                  cliProjectKey: ${{ parameters.sonarProjectKey }}
                  cliSources: .
                  extraProperties: ${{ parameters.sonarExtraProperties }}
              - task: SonarCloudAnalyze@3
                displayName: Run analysis
              - task: SonarCloudPublish@3
                displayName: Publish quality gate result
                inputs:
                  pollingTimeoutSec: 300
      - ${{ if eq(parameters.sonarProvider, 'sonarqube') }}:
          - job: sonarqube
            displayName: Static analysis (SonarQube)
            pool: ${{ parameters.pool }}
            steps:
              - template: ../steps/checkout-secure.yml
                parameters:
                  fetchDepth: 0
              # TODO: confirm the SonarQube task major versions your installed extension provides.
              - task: SonarQubePrepare@7
                displayName: Prepare analysis
                inputs:
                  SonarQube: ${{ parameters.sonarServiceConnection }}
                  scannerMode: cli
                  configMode: manual
                  cliProjectKey: ${{ parameters.sonarProjectKey }}
                  cliSources: .
                  extraProperties: ${{ parameters.sonarExtraProperties }}
              - task: SonarQubeAnalyze@7
                displayName: Run analysis
              - task: SonarQubePublish@7
                displayName: Publish quality gate result
                inputs:
                  pollingTimeoutSec: 300
