# Stage: apply the saved plan from terraform-plan. Approvals and checks live on the Azure DevOps environment.
parameters:
  # Stage identifier (letters, digits, underscore).
  - name: stageName
    type: string
    default: tf_apply
  # Stages this stage depends on (normally the matching terraform-plan stage).
  - name: dependsOn
    type: object
    default: []
  # Stage condition.
  - name: condition
    type: string
    default: succeeded()
  # Agent pool definition.
  - name: pool
    type: object
    default:
      vmImage: ubuntu-24.04
  # Azure DevOps environment name (approvals and checks are configured on it).
  - name: environmentName
    type: string
  # ARM service connection (workload identity federation) with deploy rights on the target.
  - name: serviceConnection
    type: string
  # Folder inside the plan artifact that holds the configuration. Use . when the artifact root is the configuration.
  - name: workingDirectory
    type: string
    default: .
  # Terraform version to install.
  - name: terraformVersion
    type: string
    default: 1.9.8
  # Backend resource group.
  - name: backendResourceGroup
    type: string
  # Backend storage account.
  - name: backendStorageAccount
    type: string
  # Backend blob container.
  - name: backendContainer
    type: string
    default: tfstate
  # Backend state blob key.
  - name: backendKey
    type: string
  # Artifact published by terraform-plan.
  - name: artifactName
    type: string
    default: tfplan

stages:
  - stage: ${{ parameters.stageName }}
    displayName: Terraform apply (${{ parameters.environmentName }})
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - deployment: apply
        displayName: Apply to ${{ parameters.environmentName }}
        pool: ${{ parameters.pool }}
        environment: ${{ parameters.environmentName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: ${{ parameters.artifactName }}
                - template: ../steps/terraform-run.yml
                  parameters:
                    command: apply
                    serviceConnection: ${{ parameters.serviceConnection }}
                    workingDirectory: $(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.workingDirectory }}
                    terraformVersion: ${{ parameters.terraformVersion }}
                    backendResourceGroup: ${{ parameters.backendResourceGroup }}
                    backendStorageAccount: ${{ parameters.backendStorageAccount }}
                    backendContainer: ${{ parameters.backendContainer }}
                    backendKey: ${{ parameters.backendKey }}
