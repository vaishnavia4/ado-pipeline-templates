# Stage: lint, test, build and publish a Node.js application.
parameters:
  # Stage identifier (letters, digits, underscore).
  - name: stageName
    type: string
    default: build
  # Stages this stage depends on.
  - name: dependsOn
    type: object
    default: []
  # Stage condition.
  - name: condition
    type: string
    default: succeeded()
  # Agent pool definition.
  - name: pool
    type: object
    default:
      vmImage: ubuntu-24.04
  # Node.js version spec.
  - name: nodeVersion
    type: string
    default: 20.x
  # Folder containing package.json.
  - name: workingDirectory
    type: string
    default: .
  # Lint command. Leave empty to skip.
  - name: lintCommand
    type: string
    default: npm run lint --if-present
  # Test command. Leave empty to skip. Configure a JUnit reporter in your test runner.
  - name: testCommand
    type: string
    default: npm test --if-present
  # Build command. Leave empty to skip.
  - name: buildCommand
    type: string
    default: npm run build --if-present
  # Build output folder (relative to workingDirectory) to publish.
  - name: outputPath
    type: string
    default: dist
  # Versioning strategy: buildNumber or gitversion.
  - name: versionStrategy
    type: string
    default: buildNumber
  # Major.minor prefix for the buildNumber strategy.
  - name: majorMinor
    type: string
    default: '1.0'
  # Pipeline artifact name.
  - name: artifactName
    type: string
    default: drop

stages:
  - stage: ${{ parameters.stageName }}
    displayName: Build (Node.js)
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - template: ../jobs/node-build-test.yml
        parameters:
          pool: ${{ parameters.pool }}
          nodeVersion: ${{ parameters.nodeVersion }}
          workingDirectory: ${{ parameters.workingDirectory }}
          lintCommand: ${{ parameters.lintCommand }}
          testCommand: ${{ parameters.testCommand }}
          buildCommand: ${{ parameters.buildCommand }}
          outputPath: ${{ parameters.outputPath }}
          versionStrategy: ${{ parameters.versionStrategy }}
          majorMinor: ${{ parameters.majorMinor }}
          artifactName: ${{ parameters.artifactName }}
