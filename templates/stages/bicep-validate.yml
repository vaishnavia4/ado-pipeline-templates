# Stage: bicep build, linter and what-if. Needs no environment approval; the plan is published as an artifact.
parameters:
  # Stage identifier (letters, digits, underscore).
  - name: stageName
    type: string
    default: validate
  # Stages this stage depends on.
  - name: dependsOn
    type: object
    default: []
  # Stage condition.
  - name: condition
    type: string
    default: succeeded()
  # Agent pool definition.
  - name: pool
    type: object
    default:
      vmImage: ubuntu-24.04
  # Target environment name, used in display names and the what-if summary.
  - name: environmentName
    type: string
  # ARM service connection (workload identity federation) for the what-if. Use a plan-only identity (Reader plus deployments/whatIf/action).
  - name: serviceConnection
    type: string
  # Deployment scope: resourceGroup or subscription.
  - name: deploymentScope
    type: string
    default: resourceGroup
    values:
      - resourceGroup
      - subscription
  # Target resource group (resourceGroup scope).
  - name: resourceGroupName
    type: string
    default: ''
  # Deployment location (subscription scope).
  - name: location
    type: string
    default: ''
  # Folder containing the Bicep files. It is published as the deployment artifact.
  - name: workingDirectory
    type: string
    default: infra
  # Main Bicep file (relative to workingDirectory).
  - name: templateFile
    type: string
    default: main.bicep
  # Parameters file (.bicepparam or .json, relative to workingDirectory). Leave empty for none.
  - name: parametersFile
    type: string
    default: ''
  # Name of the artifact holding the validated Bicep files (unique per pipeline run).
  - name: artifactName
    type: string
    default: bicep

stages:
  - stage: ${{ parameters.stageName }}
    displayName: Validate (${{ parameters.environmentName }})
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: validate
        displayName: Build, lint and what-if
        pool: ${{ parameters.pool }}
        steps:
          - template: ../steps/checkout-secure.yml
          - bash: |
              set -euo pipefail
              cd "${WORKING_DIRECTORY}"
              az bicep install
              az bicep build --file "${TEMPLATE_FILE}" --stdout > /dev/null
              az bicep lint --file "${TEMPLATE_FILE}"
            displayName: Bicep build and lint
            env:
              WORKING_DIRECTORY: ${{ parameters.workingDirectory }}
              TEMPLATE_FILE: ${{ parameters.templateFile }}
          - task: AzureCLI@2
            displayName: What-if (${{ parameters.environmentName }})
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                out="${BUILD_ARTIFACTSTAGINGDIRECTORY}/whatif"
                mkdir -p "${out}"
                cd "${WORKING_DIRECTORY}"
                args=()
                if [[ "${PARAMETERS_FILE}" == *.bicepparam ]]; then
                  args+=(--parameters "${PARAMETERS_FILE}")
                else
                  args+=(--template-file "${TEMPLATE_FILE}")
                  if [ -n "${PARAMETERS_FILE}" ]; then args+=(--parameters "${PARAMETERS_FILE}"); fi
                fi
                if [ "${SCOPE}" = "subscription" ]; then
                  az deployment sub what-if --location "${LOCATION}" "${args[@]}" \
                    --no-pretty-print --only-show-errors --output json > "${out}/whatif.json"
                else
                  az deployment group what-if --resource-group "${RESOURCE_GROUP}" "${args[@]}" \
                    --no-pretty-print --only-show-errors --output json > "${out}/whatif.json"
                fi
                {
                  echo "## What-if: ${ENVIRONMENT_NAME}"
                  echo
                  echo "| Change | Resource |"
                  echo "| --- | --- |"
                  jq -r '.changes[] | "| \(.changeType) | \(.resourceId) |"' "${out}/whatif.json"
                } > "${out}/whatif.md"
                cat "${out}/whatif.md"
                echo "##vso[task.uploadsummary]${out}/whatif.md"
            env:
              WORKING_DIRECTORY: ${{ parameters.workingDirectory }}
              TEMPLATE_FILE: ${{ parameters.templateFile }}
              PARAMETERS_FILE: ${{ parameters.parametersFile }}
              SCOPE: ${{ parameters.deploymentScope }}
              RESOURCE_GROUP: ${{ parameters.resourceGroupName }}
              LOCATION: ${{ parameters.location }}
              ENVIRONMENT_NAME: ${{ parameters.environmentName }}
          - template: ../steps/publish-artifact.yml
            parameters:
              path: $(Build.ArtifactStagingDirectory)/whatif
              artifactName: whatif_${{ parameters.stageName }}
              condition: succeededOrFailed()
          - template: ../steps/publish-artifact.yml
            parameters:
              path: ${{ parameters.workingDirectory }}
              artifactName: ${{ parameters.artifactName }}
