# Stage: build, unit test (with coverage) and publish a .NET application.
parameters:
  # Stage identifier (letters, digits, underscore).
  - name: stageName
    type: string
    default: build
  # Stages this stage depends on.
  - name: dependsOn
    type: object
    default: []
  # Stage condition.
  - name: condition
    type: string
    default: succeeded()
  # Agent pool definition.
  - name: pool
    type: object
    default:
      vmImage: ubuntu-24.04
  # .NET SDK version spec.
  - name: dotnetVersion
    type: string
    default: 8.x
  # Solution or project glob to restore, build and test.
  - name: solution
    type: string
    default: '**/*.sln'
  # Projects to publish (glob).
  - name: publishProjects
    type: string
    default: '**/*.csproj'
  # Build configuration.
  - name: buildConfiguration
    type: string
    default: Release
  # Run unit tests and publish results and coverage.
  - name: runTests
    type: boolean
    default: true
  # Versioning strategy: buildNumber or gitversion.
  - name: versionStrategy
    type: string
    default: buildNumber
  # Major.minor prefix for the buildNumber strategy.
  - name: majorMinor
    type: string
    default: '1.0'
  # Pipeline artifact name.
  - name: artifactName
    type: string
    default: drop

stages:
  - stage: ${{ parameters.stageName }}
    displayName: Build (.NET)
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - template: ../jobs/dotnet-build-test.yml
        parameters:
          pool: ${{ parameters.pool }}
          dotnetVersion: ${{ parameters.dotnetVersion }}
          solution: ${{ parameters.solution }}
          publishProjects: ${{ parameters.publishProjects }}
          buildConfiguration: ${{ parameters.buildConfiguration }}
          runTests: ${{ parameters.runTests }}
          versionStrategy: ${{ parameters.versionStrategy }}
          majorMinor: ${{ parameters.majorMinor }}
          artifactName: ${{ parameters.artifactName }}
