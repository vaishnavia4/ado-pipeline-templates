name: validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --requirement requirements-dev.txt
      - name: Lint YAML
        run: yamllint --strict .
      - name: Parameter docs are current
        run: python scripts/gen_param_docs.py --check
      - name: Tests
        run: python -m pytest --quiet
